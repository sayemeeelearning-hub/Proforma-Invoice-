<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI Software - System Notice</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #05070A;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Central Overview Container -->
    <div class="max-w-xl w-full bg-slate-900/90 border border-slate-800 p-8 md:p-10 rounded-2xl shadow-2xl backdrop-blur-xl text-center">
        
        <!-- Warning Icon / Indicator -->
        <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl shadow-[0_0_25px_rgba(245,158,11,0.2)]">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <!-- Main Display Message -->
        <h1 class="text-xl md:text-2xl font-semibold tracking-tight text-white leading-relaxed mb-6">
            এই সফটওয়্যারটি ব্যবহার করার মতো এখনো কোনো প্রফেশনাল লোক খুঁজে পাওয়া যায়নি। তাই আমি নিজে নিজে কার্যক্রম হারিয়ে ফেলেছি।
        </h1>

        <!-- Optional Close Button -->
        <button onclick="window.close()" class="py-2.5 px-6 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition-all duration-200 border border-slate-700 cursor-pointer">
            বন্ধ করুন (Close)
        </button>

    </div>

</body>
</html>
