<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সফটওয়্যার আপডেট চলছে | Software Update in Progress</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Hind Siliguri & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* Glassmorphism styling */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(59, 130, 246, 0.15);
        }

        /* Ambient Glowing Background Orbs */
        .glow-orb-1 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: 15%;
            left: 20%;
            animation: float 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        .glow-orb-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            bottom: 10%;
            right: 15%;
            animation: float 10s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) scale(1);
            }
            100% {
                transform: translateY(-40px) scale(1.1);
            }
        }

        /* Continuous Progress Line Animation */
        .progress-line {
            height: 4px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-line::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
            border-radius: 4px;
            animation: loading 2s linear infinite;
        }

        @keyframes loading {
            0% {
                left: -50%;
            }
            100% {
                left: 100%;
            }
        }

        /* Gear Pulse & Rotation Animation */
        .gear-container {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .gear-main {
            animation: spin 12s linear infinite;
        }

        .gear-small {
            animation: spin-reverse 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Subtle Pulse Effect for Icons */
        .pulse-glow {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.8));
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative text-slate-100">

    <!-- Background glowing ambient lights -->
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    
    <!-- Canvas for interactive background particles -->
    <canvas id="particleCanvas" class="absolute inset-0 z-0 pointer-events-none"></canvas>

    <main class="relative z-10 w-full max-w-lg">
        <div class="glass-card rounded-3xl p-8 sm:p-12 text-center transition-all duration-300 transform hover:scale-[1.01]">
            
            <!-- Dynamic Animated Gear / Wrench Icon Block -->
            <div class="mb-8 flex justify-center items-center">
                <div class="gear-container p-6 rounded-2xl bg-slate-800/60 border border-slate-700/50 shadow-inner pulse-glow">
                    <div class="relative w-16 h-16 flex items-center justify-center">
                        <i class="fa-solid fa-gear gear-main text-5xl text-blue-500"></i>
                        <i class="fa-solid fa-wrench gear-small absolute text-2xl text-purple-400"></i>
                    </div>
                </div>
            </div>

            <!-- Main Heading (Bengali Message) -->
            <h1 class="text-2xl sm:text-3xl font-bold text-white mb-3 tracking-wide leading-relaxed">
                সফটওয়্যার আপডেটের কাজ চলছে,
                <span class="block text-blue-400 mt-1 font-semibold">দয়া করে অপেক্ষা করুন।</span>
            </h1>

            <!-- Subtitle / Context -->
            <p class="text-slate-400 text-sm sm:text-base font-light mb-8 leading-relaxed">
                আমরা আমাদের সফটওয়্যারকে আরও উন্নত ও গতিশীল করার জন্য কাজ করছি। খুব শীঘ্রই আপডেট শেষ হবে!
            </p>

            <!-- Animated Progress Line Bar -->
            <div class="space-y-2 mb-8">
                <div class="flex justify-between text-xs text-slate-400 font-mono px-1">
                    <span>SOFTWARE UPDATE</span>
                    <span class="animate-pulse text-blue-400">IN PROGRESS...</span>
                </div>
                <div class="progress-line"></div>
            </div>

            <!-- Information Badges -->
            <div class="grid grid-cols-2 gap-3 mb-8 text-xs sm:text-sm">
                <div class="bg-slate-800/40 border border-slate-700/40 rounded-xl p-3 flex items-center justify-center space-x-2 text-slate-300">
                    <i class="fa-regular fa-clock text-blue-400"></i>
                    <span>সাময়িক বিরতি</span>
                </div>
                <div class="bg-slate-800/40 border border-slate-700/40 rounded-xl p-3 flex items-center justify-center space-x-2 text-slate-300">
                    <i class="fa-solid fa-code text-purple-400"></i>
                    <span>ভার্সন আপডেট</span>
                </div>
            </div>

            <!-- Action / Refresh Button -->
            <button onclick="window.location.reload()" 
                    class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 transition-all duration-300 flex items-center justify-center space-x-2 group">
                <i class="fa-solid fa-rotate-right group-hover:rotate-180 transition-transform duration-500"></i>
                <span>পুনরায় চেষ্টা করুন</span>
            </button>

            <!-- Footer / Copyright Line -->
            <p class="mt-8 text-xs text-slate-500">
                &copy; <span id="year"></span> সর্বস্বত্ব সংরক্ষিত। ধৈর্য ধরার জন্য ধন্যবাদ!
            </p>
        </div>
    </main>

    <script>
        // Set dynamic current year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Canvas Particles Animation Logic
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = `rgba(147, 197, 253, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            const numberOfParticles = Math.floor((width * height) / 12000);
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        // Initialize and start loop
        initParticles();
        animateParticles();
    </script>
</body>
</html>
