<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proforma Invoice (PI) Generator</title>
    <!-- SheetJS Style CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 20px;
            padding: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 {
            color: #2c3e50;
            margin: 0;
        }
        .pi-type-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #eef2f3;
            padding: 6px 12px;
            border-radius: 6px;
        }
        .pi-type-container label {
            font-weight: bold;
            font-size: 13px;
            color: #2c3e50;
            margin-bottom: 0;
        }
        .section-title {
            background-color: #34495e;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #333;
        }
        input, select, textarea {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 13px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #3498db;
        }
        textarea {
            resize: vertical;
            white-space: pre-line;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-add { background-color: #27ae60; color: white; flex: 1; }
        .btn-add:hover { background-color: #219150; }
        .btn-export { background-color: #2980b9; color: white; flex: 1; }
        .btn-export:hover { background-color: #1f6391; }
        .btn-print { background-color: #8e44ad; color: white; flex: 1; }
        .btn-print:hover { background-color: #732d91; }
        .btn-reset { background-color: #e74c3c; color: white; flex: 0.5; }
        .btn-reset:hover { background-color: #c0392b; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
            font-size: 12px;
            vertical-align: middle;
        }
        th {
            background-color: #f2f2f2;
            color: #000;
            font-weight: bold;
            text-align: center;
        }
        .wrap-cell {
            white-space: pre-line;
            word-wrap: break-word;
        }
        .total-row {
            font-weight: bold;
            background-color: #fff !important;
        }
        .action-btn {
            background-color: #ff4d4d;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-edit {
            background-color: #f39c12;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }

        #printTemplate { display: none; }

        @media print {
            @page {
                size: A4 portrait;
                margin: 8mm 10mm 8mm 10mm;
            }
            body { background-color: #fff !important; margin: 0 !important; padding: 0 !important; }
            .container { display: none !important; }
            #printTemplate { display: block !important; width: 100% !important; }
            img {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header with Dropdown -->
    <div class="header-container">
        <h2>Proforma Invoice (PI) Generator</h2>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <div class="pi-type-container no-print" style="background: #fff3cd; border: 1px solid #ffeeba;">
                <label for="headerFontSize">Header Font Size:</label>
                <input type="number" id="headerFontSize" value="16" min="10" max="30" style="width: 60px; padding: 4px; text-align: center;">
            </div>
            <div class="pi-type-container no-print">
                <label for="piType">PI Item:</label>
                <select id="piType" onchange="handlePiTypeChange()">
                    <option value="elastic">1. Elastic/Twill tape/Drawstring</option>
                    <option value="poly">2. Poly</option>
                    <option value="label" selected>3. Label</option>
                    <option value="thread">4. Swing thread</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Header & Buyer Information Form -->
    <div class="section-title">১. ইনভয়েস ও বায়ারের তথ্য (Invoice & Buyer Info)</div>
    <div class="form-grid">
        <div class="form-group">
            <label for="piNo">PI NO</label>
            <input type="text" id="piNo" value="SACL/296/2026">
        </div>
        <div class="form-group">
            <label for="piDate">DATE</label>
            <input type="text" id="piDate" value="08.08.2026">
        </div>
        <div class="form-group">
            <label for="buyerName">Name of Buyer</label>
            <input type="text" id="buyerName" value="BANDO DESIGN LTD.">
        </div>
        <div class="form-group">
            <label for="buyerRef">BUYER REF</label>
            <input type="text" id="buyerRef" value="Buyer: GAP SPR'26.">
        </div>
        <div class="form-group">
            <label for="attn">Attn</label>
            <input type="text" id="attn" value="Mr. Rion">
        </div>
        <div class="form-group full-width">
            <label for="buyerAddress">Address of Buyer</label>
            <textarea id="buyerAddress" rows="3" placeholder="Enter buyer address...">PURBO NARSINGHAPUR, EARPUR, UNION PARISHAD ROAD, ASHULIA, SAVAR, DHAKA.</textarea>
        </div>
    </div>

    <!-- Product Input Form -->
    <div class="section-title">২. প্রোডাক্ট তথ্য যোগ করুন (Product Details)</div>
    <div class="form-grid" id="dynamicInputContainer"></div>

    <!-- Buttons -->
    <div class="btn-container no-print">
        <button type="button" class="btn-add" onclick="addItem()">+ ডাটা যোগ করুন (Add Row)</button>
        <button type="button" class="btn-export" onclick="exportToExcel()">📥 এক্সেল ডাউনলোড (Export to Excel)</button>
        <button type="button" class="btn-print" onclick="printPDF()">🖨️ PDF / প্রিন্ট (Save/Print PDF)</button>
        <button type="button" class="btn-reset" onclick="resetAllData()">🗑️ রিসেট (Reset All)</button>
    </div>

    <!-- Data Table -->
    <table id="dataTable">
        <thead>
            <tr id="tableHeaderRow"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFooter"></tfoot>
    </table>
</div>

<script>
    const stampImageUrl = "https://raw.githubusercontent.com/sayemeeelearning-hub/Seal-/main/Picture1.png";

    let items = [];
    let slCounter = 1;
    let editIndex = -1;

    window.onload = function() {
        const savedItems = localStorage.getItem('pi_items_data');
        const savedHeader = localStorage.getItem('pi_header_data');

        if (savedItems) {
            try {
                items = JSON.parse(savedItems);
                if (items.length > 0) {
                    slCounter = items[items.length - 1].slNo + 1;
                }
            } catch (e) { items = []; }
        }

        if (savedHeader) {
            try {
                const headerObj = JSON.parse(savedHeader);
                if (headerObj.piType) {
                    document.getElementById('piType').value = headerObj.piType;
                }
                document.getElementById('piNo').value = headerObj.piNo || 'SACL/296/2026';
                document.getElementById('piDate').value = headerObj.piDate || '08.08.2026';
                document.getElementById('buyerName').value = headerObj.buyerName || 'BANDO DESIGN LTD.';
                document.getElementById('buyerAddress').value = headerObj.buyerAddress || 'PURBO NARSINGHAPUR, EARPUR, UNION PARISHAD ROAD, ASHULIA, SAVAR, DHAKA.';
                document.getElementById('buyerRef').value = headerObj.buyerRef || "Buyer: GAP SPR'26.";
                document.getElementById('attn').value = headerObj.attn || 'Mr. Rion';
                if (headerObj.headerFontSize) {
                    document.getElementById('headerFontSize').value = headerObj.headerFontSize;
                }
            } catch (e) {}
        }

        handlePiTypeChange(); 
        updateTable();
        
        ['piNo', 'piDate', 'buyerName', 'buyerAddress', 'buyerRef', 'attn', 'headerFontSize'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.addEventListener('input', saveHeaderToStorage);
        });
        document.getElementById('piType').addEventListener('change', saveHeaderToStorage);
    };

    function handlePiTypeChange() {
        const piType = document.getElementById('piType').value;
        const inputContainer = document.getElementById('dynamicInputContainer');
        const tableHeaderRow = document.getElementById('tableHeaderRow');
        const tableFooter = document.getElementById('tableFooter');
        
        let baseInputs = `
            <div class="form-group"><label for="slNo">1. SL No.</label><input type="number" id="slNo" value="${slCounter}" min="1"></div>
            <div class="form-group"><label for="hsCode">2. H.S CODE</label><input type="text" id="hsCode" placeholder="e.g. 5806.20.00"></div>
        `;

        if(piType === 'label') {
            let labelInputs = `
                ${baseInputs}
                <div class="form-group"><label for="item">3. Item</label><input type="text" id="item" value="Printed Care Label"></div>
                <div class="form-group"><label for="descriptionGoods">4. Description of Goods</label><input type="text" id="descriptionGoods" value="Size: 25mm X 70mm max."></div>
                <div class="form-group"><label for="projectNo">5. Project No.</label><textarea id="projectNo" rows="2" placeholder="Project No..."></textarea></div>
                <div class="form-group"><label for="articleNo">6. Article No.</label><textarea id="articleNo" rows="2" placeholder="Article No..."></textarea></div>
                <div class="form-group"><label for="color">7. Color</label><textarea id="color" rows="2" placeholder="Color..."></textarea></div>
                <div class="form-group"><label for="qty">8. QTY (Yds/Pcs)</label><input type="number" id="qty" placeholder="0"></div>
                <div class="form-group"><label for="unitDropdown">9. Unit (Yds/Dzn)</label><select id="unitDropdown"><option value="Pcs">Pcs</option><option value="Yds">Yds</option><option value="Dzn">Dzn</option></select></div>
                <div class="form-group"><label for="weightPerUnit">10. Weight/Unit (KG)</label><input type="number" step="0.0001" id="weightPerUnit" placeholder="0.0000"></div>
                <div class="form-group"><label for="unitPrice">11. Unit Price (USD)</label><input type="number" step="0.0001" id="unitPrice" placeholder="0.0000"></div>
            `;
            inputContainer.innerHTML = labelInputs;

            tableHeaderRow.innerHTML = `
                <th>SL No.</th><th>H.S CODE</th><th>Item</th><th>Description of Goods</th><th>Project No.</th><th>Article No.</th><th>Color</th><th>QTY (Yds/Pcs)</th><th>Unit (Yds/Dzn)</th><th>QTY in (KG)</th><th>Unit Price (USD)</th><th>Amount (USD)</th><th class="no-print">অ্যাকশন</th>
            `;

            tableFooter.innerHTML = `
                <tr class="total-row">
                    <td colspan="7" style="text-align: right; font-weight: bold;">Total =</td>
                    <td id="totalQty" style="font-weight: bold;">0</td>
                    <td>-</td>
                    <td id="totalKg" style="font-weight: bold;">0.00</td>
                    <td>-</td>
                    <td id="totalAmount" style="font-weight: bold;">0.00</td>
                    <td class="no-print">-</td>
                </tr>
            `;
        } else if(piType === 'elastic') {
            inputContainer.innerHTML = `
                ${baseInputs}
                <div class="form-group"><label for="desc">Description of Goods</label><input type="text" id="desc" placeholder="Description..."></div>
                <div class="form-group"><label for="measurement">Measurement</label><input type="text" id="measurement" placeholder="Measurement..."></div>
                <div class="form-group"><label for="styNo">Style No.</label><input type="text" id="styNo" placeholder="Style No..."></div>
                <div class="form-group"><label for="poNo">PO No.</label><input type="text" id="poNo" placeholder="PO No..."></div>
                <div class="form-group"><label for="color">Color</label><input type="text" id="color" placeholder="Color..."></div>
                <div class="form-group"><label for="qty">QTY</label><input type="number" id="qty" placeholder="0"></div>
                <div class="form-group"><label for="weightPerUnit">Weight/Unit (KG)</label><input type="number" step="0.0001" id="weightPerUnit" placeholder="0.025"></div>
                <div class="form-group"><label for="unit">Unit</label><input type="text" id="unit" value="Yds"></div>
                <div class="form-group"><label for="price">Unit Price (USD)</label><input type="number" step="0.0001" id="price" placeholder="0.0000"></div>
            `;
            tableHeaderRow.innerHTML = `
                <th>SL No.</th><th>H.S CODE</th><th>Description of Goods</th><th>Measurement</th><th>PO/Style NO.</th><th>Color</th><th>QTY</th><th>Unit</th><th>QTY IN (Kg)</th><th>Unit Price (USD)</th><th>Amount (USD)</th><th class="no-print">অ্যাকশন</th>
            `;
            tableFooter.innerHTML = `
                <tr class="total-row">
                    <td colspan="6" style="text-align: right; font-weight: bold;">Total =</td>
                    <td id="totalQty" style="font-weight: bold;">0</td>
                    <td style="font-weight: bold;">Yds</td>
                    <td id="totalKg" style="font-weight: bold;">0.00</td>
                    <td>-</td>
                    <td id="totalAmount" style="font-weight: bold;">0.00</td>
                    <td class="no-print">-</td>
                </tr>
            `;
        } else if(piType === 'thread') {
            inputContainer.innerHTML = `
                ${baseInputs}
                <div class="form-group"><label for="desc">Description of Goods</label><input type="text" id="desc" placeholder="Description..."></div>
                <div class="form-group"><label for="measurement">Measurement</label><input type="text" id="measurement" placeholder="Measurement..."></div>
                <div class="form-group"><label for="style">Style/ PO No.</label><input type="text" id="style" placeholder="Style/PO..."></div>
                <div class="form-group"><label for="color">Color</label><input type="text" id="color" placeholder="Color..."></div>
                <div class="form-group"><label for="bleach">Bleach/Non Bleach</label><select id="bleach"><option value="Non Bleach">Non Bleach</option><option value="Bleach">Bleach</option></select></div>
                <div class="form-group"><label for="qty">QTY</label><input type="number" id="qty" placeholder="0"></div>
                <div class="form-group"><label for="weightPerUnit">Weight/Unit (KG)</label><input type="number" step="0.0001" id="weightPerUnit" placeholder="0.025"></div>
                <div class="form-group"><label for="unit">Unit</label><input type="text" id="unit" value="Cone"></div>
                <div class="form-group"><label for="price">Unit Price (USD)</label><input type="number" step="0.0001" id="price" placeholder="0.0000"></div>
            `;
            tableHeaderRow.innerHTML = `
                <th>SL No.</th><th>H.S CODE</th><th>Description of Goods</th><th>Measurement</th><th>Style/ PO No.</th><th>Color</th><th>Bleach/ Non Bleach</th><th>QTY</th><th>Unit</th><th>QTY IN (KG)</th><th>Unit Price (USD)</th><th>Amount (USD)</th><th class="no-print">অ্যাকশন</th>
            `;
            tableFooter.innerHTML = `
                <tr class="total-row">
                    <td colspan="7" style="text-align: right; font-weight: bold;">Total =</td>
                    <td id="totalQty" style="font-weight: bold;">0</td>
                    <td style="font-weight: bold;">Cone</td>
                    <td id="totalKg" style="font-weight: bold;">0.00</td>
                    <td>-</td>
                    <td id="totalAmount" style="font-weight: bold;">0.00</td>
                    <td class="no-print">-</td>
                </tr>
            `;
        } else {
            inputContainer.innerHTML = `
                ${baseInputs}
                <div class="form-group"><label for="desc">Description of Goods</label><input type="text" id="desc" placeholder="Description..."></div>
                <div class="form-group"><label for="measurement">Measurement</label><input type="text" id="measurement" placeholder="Measurement..."></div>
                <div class="form-group"><label for="style">Style/PO No.</label><input type="text" id="style" placeholder="Style/PO..."></div>
                <div class="form-group"><label for="qty">QTY</label><input type="number" id="qty" placeholder="0"></div>
                <div class="form-group"><label for="weightPerUnit">Weight/Unit (KG)</label><input type="number" step="0.0001" id="weightPerUnit" placeholder="0.025"></div>
                <div class="form-group"><label for="unit">Unit</label><input type="text" id="unit" value="Pcs"></div>
                <div class="form-group"><label for="price">Unit Price (USD)</label><input type="number" step="0.0001" id="price" placeholder="0.0000"></div>
            `;
            tableHeaderRow.innerHTML = `
                <th>SL No.</th><th>H.S CODE</th><th>Description of Goods</th><th>Measurement</th><th>Style/PO No.</th><th>QTY (Pcs)</th><th>QTY (KG)</th><th>Unit</th><th>Unit Price (USD)</th><th>Amount (USD)</th><th class="no-print">অ্যাকশন</th>
            `;
            tableFooter.innerHTML = `
                <tr class="total-row">
                    <td colspan="5" style="text-align: right; font-weight: bold;">Total =</td>
                    <td id="totalQty" style="font-weight: bold;">0</td>
                    <td id="totalKg" style="font-weight: bold;">0.00</td>
                    <td style="font-weight: bold;">Pcs</td>
                    <td>-</td>
                    <td id="totalAmount" style="font-weight: bold;">0.00</td>
                    <td class="no-print">-</td>
                </tr>
            `;
        }
        
        saveHeaderToStorage();
        updateTable();
        const slInput = document.getElementById('slNo');
        if(slInput) slInput.value = slCounter;
    }

    function saveHeaderToStorage() {
        const headerObj = {
            piType: document.getElementById('piType').value,
            piNo: document.getElementById('piNo').value,
            piDate: document.getElementById('piDate').value,
            buyerName: document.getElementById('buyerName').value,
            buyerAddress: document.getElementById('buyerAddress').value,
            buyerRef: document.getElementById('buyerRef').value,
            attn: document.getElementById('attn').value,
            headerFontSize: document.getElementById('headerFontSize').value
        };
        localStorage.setItem('pi_header_data', JSON.stringify(headerObj));
    }

    function saveDataToStorage() {
        localStorage.setItem('pi_items_data', JSON.stringify(items));
    }

    function addItem() {
        const piType = document.getElementById('piType').value;
        const slNo = parseInt(document.getElementById('slNo').value) || slCounter;
        const hsCode = document.getElementById('hsCode').value;

        let itemData = { piType, slNo, hsCode };

        if(piType === 'label') {
            itemData.item = document.getElementById('item').value;
            itemData.descriptionGoods = document.getElementById('descriptionGoods').value;
            itemData.projectNo = document.getElementById('projectNo').value;
            itemData.articleNo = document.getElementById('articleNo').value;
            itemData.color = document.getElementById('color').value;
            itemData.qty = parseFloat(document.getElementById('qty').value) || 0;
            itemData.unitDropdown = document.getElementById('unitDropdown').value;
            const weightPerUnit = parseFloat(document.getElementById('weightPerUnit').value) || 0;
            itemData.weightPerUnit = weightPerUnit;
            itemData.qtyKg = parseFloat((itemData.qty * weightPerUnit).toFixed(4));
            itemData.unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
            itemData.amount = parseFloat((itemData.qty * itemData.unitPrice).toFixed(4));

            if (!itemData.projectNo || itemData.qty <= 0 || itemData.unitPrice <= 0) {
                alert('দয়া করে প্রজেক্ট নম্বর, সঠিক পরিমাণ এবং একক মূল্য লিখুন!');
                return;
            }
        } else {
            itemData.desc = document.getElementById('desc').value;
            itemData.measurement = document.getElementById('measurement').value;
            itemData.qty = parseFloat(document.getElementById('qty').value) || 0;
            const weightPerUnit = parseFloat(document.getElementById('weightPerUnit').value) || 0;
            itemData.weightPerUnit = weightPerUnit;
            itemData.unit = document.getElementById('unit').value;
            itemData.price = parseFloat(document.getElementById('price').value) || 0;
            itemData.qtyKg = parseFloat((itemData.qty * weightPerUnit).toFixed(4));
            itemData.amount = parseFloat((itemData.qty * itemData.price).toFixed(4));

            if(piType === 'elastic') {
                itemData.styNo = document.getElementById('styNo').value;
                itemData.poNo = document.getElementById('poNo').value;
                itemData.color = document.getElementById('color').value;
            } else if(piType === 'thread') {
                itemData.style = document.getElementById('style').value;
                itemData.color = document.getElementById('color').value;
                itemData.bleach = document.getElementById('bleach').value;
            } else {
                itemData.style = document.getElementById('style').value;
            }

            if (!itemData.desc || itemData.qty <= 0 || itemData.price <= 0) {
                alert('দয়া করে সঠিক বিবরণ, পরিমাণ এবং একক মূল্য লিখুন!');
                return;
            }
        }

        if (editIndex === -1) {
            items.push(itemData);
            slCounter = slNo + 1;
            const nextSl = document.getElementById('slNo');
            if(nextSl) nextSl.value = slCounter;
        } else {
            items[editIndex] = itemData;
            editIndex = -1;
            const addBtn = document.querySelector('.btn-add');
            addBtn.innerText = '+ ডাটা যোগ করুন (Add Row)';
            addBtn.style.backgroundColor = '#27ae60';
        }

        saveDataToStorage();
        updateTable();
    }

    function editItem(index) {
        const item = items[index];
        if(item.piType) {
            document.getElementById('piType').value = item.piType;
            handlePiTypeChange();
        }
        document.getElementById('slNo').value = item.slNo;
        document.getElementById('hsCode').value = item.hsCode || '';

        if(item.piType === 'label') {
            document.getElementById('item').value = item.item || 'Printed Care Label';
            document.getElementById('descriptionGoods').value = item.descriptionGoods || '';
            document.getElementById('projectNo').value = item.projectNo || '';
            document.getElementById('articleNo').value = item.articleNo || '';
            document.getElementById('color').value = item.color || '';
            document.getElementById('qty').value = item.qty || '';
            document.getElementById('unitDropdown').value = item.unitDropdown || 'Pcs';

    function numToWords(num) {
        const a = ['','one ','two ','three ','four ','five ','six ','seven ','eight ','nine ','ten ','eleven ','twelve ','thirteen ','fourteen ','fifteen ','sixteen ','seventeen ','eighteen ','nineteen '];
        const b = ['', '', 'twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
        
        function inWords(n) {
            if ((n = n.toString()).length > 9) return 'overflow';
            let n_array = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
            if (!n_array) return ''; 
            let str = '';
            str += (n_array[1] != 0) ? (a[Number(n_array[1])] || b[n_array[1][0]] + ' ' + a[n_array[1][1]]) + 'crore ' : '';
            str += (n_array[2] != 0) ? (a[Number(n_array[2])] || b[n_array[2][0]] + ' ' + a[n_array[2][1]]) + 'lakh ' : '';
            str += (n_array[3] != 0) ? (a[Number(n_array[3])] || b[n_array[3][0]] + ' ' + a[n_array[3][1]]) + 'thousand ' : '';
            str += (n_array[4] != 0) ? (a[Number(n_array[4])] || b[n_array[4][0]] + ' ' + a[n_array[4][1]]) + 'hundred ' : '';
            str += (n_array[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_array[5])] || b[n_array[5][0]] + ' ' + a[n_array[5][1]]) : '';
            return str;
        }

        const parts = num.toFixed(2).split('.');
        const dollars = parseInt(parts[0]);
        const cents = parseInt(parts[1]);

        let result = 'US Dollar ';
        result += inWords(dollars) ? inWords(dollars) + 'dollars ' : 'zero dollars ';
        if (cents > 0) {
            result += '& Cents ' + inWords(cents) + 'Only.';
        } else {
            result += 'Only.';
        }
        return result.replace(/\s+/g, ' ').trim();
    }
